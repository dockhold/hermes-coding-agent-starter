name: Upstream release check
# Once a week, compare the Hermes Agent release pinned in the Dockerfile with
# the latest stable release on GitHub. When they differ, open one issue (or
# update the open one) with the new release and the upgrade steps. The pin
# keeps rebuilds identical; this is what keeps it from going stale unnoticed.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare the pinned release with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          pinned=$(sed -n 's/^ARG HERMES_REF=\(v[0-9][0-9.]*\)$/\1/p' Dockerfile | head -n 1)
          [ -n "$pinned" ] || { echo "could not read HERMES_REF from the Dockerfile"; exit 1; }
          # The latest stable release: GitHub's "latest" skips pre-releases
          # and drafts, so canary builds never count.
          latest=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          # The tag comes from outside this repo. Accept v, digits and dots
          # only before it goes anywhere near a shell or an issue.
          case "$latest" in
            v*) case "${latest#v}" in *[!0-9.]*|"") echo "unexpected tag: $latest"; exit 1 ;; esac ;;
            *) echo "unexpected tag: $latest"; exit 1 ;;
          esac
          echo "pinned: $pinned, latest: $latest"
          if [ "$pinned" = "$latest" ]; then
            echo "up to date"
            exit 0
          fi
          title="Upstream release: Hermes Agent ${latest} (pinned ${pinned})"
          body=$(cat <<BODY
          Hermes Agent **${latest}** is the latest release; this starter pins **${pinned}**.

          Release notes: https://github.com/NousResearch/hermes-agent/releases/tag/${latest}

          To upgrade:

          1. Read the release notes from ${pinned} to ${latest}. Look for changes to \`hermes chat\` one-shot runs (\`--query-file\`, \`--format stream-json\`, \`--ignore-rules\`), config.yaml keys (\`approvals\`, \`mcp_servers\`, \`providers\`), context files and project plugins.
          2. In the Dockerfile set \`HERMES_REF=${latest}\`.
          3. Build the image. If the build stops at the provider list, regenerate it as the README says and review the difference.
          4. Push a branch. The Check workflow runs the unit and loop tests and the smoke test, which fails if Hermes rejects an option, or if a file planted in a checkout reaches the model or runs.
          5. Run one real task on a test repository before merging.
          6. Add a CHANGELOG entry, then merge.

          This issue is updated by the weekly upstream check until the pin moves.
          BODY
          )
          gh label create upstream --description "Upstream release moved" --color 0E8A16 --force >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label upstream --search "Upstream release: Hermes Agent in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label upstream
          fi
